name: Auto Sync Podcast Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual sync button trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Parse RSS Feed
        run: python update_sermons.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.value "github-actions[bot]@users.noreply.github.com"
          git add sermons.json
          git commit -m "Auto-update sermons.json" || exit 0
          git push
