name: Auto Sync Podcast Feed

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Manual trigger button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grants explicit write access to push sermons.json

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Pulls full history to prevent merge conflicts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Parse RSS Feed
        run: python update_sermons.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add sermons.json
          
          # Only commit and push if sermons.json actually changed
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update sermons.json [skip ci]"
            git push
          else
            echo "No changes detected in sermons.json. Skipping commit."
          fi
